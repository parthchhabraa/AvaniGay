<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="description" content="The Build Gazette — a front page for every project built here, kept up to date as new work ships." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>The Build Gazette</title>
    <style>
      :root {
        --paper: #f4f1e8;
        --paper-raised: #faf8f2;
        --ink: #1c1a15;
        --ink-soft: #4a4638;
        --ink-faint: #8c8672;
        --rule: #c9c2ab;
        --rule-strong: #1c1a15;
        --accent: #7a1f1f;
        --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
        --font-display: "Fraunces", "Source Serif 4", Georgia, serif;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        background: var(--paper);
        background-image: radial-gradient(rgba(28, 26, 21, 0.035) 1px, transparent 1px);
        background-size: 3px 3px;
        color: var(--ink);
        font-family: var(--font-serif);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      ::selection {
        background: #d8cfa8;
        color: var(--ink);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* ---------- Masthead ---------- */

      .masthead-bar {
        border-bottom: 1px solid var(--rule);
      }

      .masthead-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        font-family: var(--font-sans);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .masthead {
        padding: 28px 0 20px;
        text-align: center;
      }

      .masthead h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: clamp(40px, 8vw, 76px);
        letter-spacing: -0.01em;
        line-height: 1;
      }

      .masthead p {
        margin: 12px auto 0;
        max-width: 40em;
        font-style: italic;
        color: var(--ink-soft);
        font-size: 16px;
      }

      .rule-thick {
        border: 0;
        border-top: 4px solid var(--rule-strong);
        margin: 0;
      }

      .rule-thin {
        border: 0;
        border-top: 1px solid var(--rule-strong);
        margin: 3px 0 0;
      }

      /* ---------- Front page grid ---------- */

      main {
        padding: 36px 0 20px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 22px;
      }

      .section-label::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--rule-strong);
      }

      .front-page {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0;
        border-top: 1px solid var(--rule-strong);
      }

      .story {
        padding: 26px 28px 30px;
        border-bottom: 1px solid var(--rule);
      }

      .story:nth-child(odd) {
        border-right: 1px solid var(--rule);
      }

      .story-kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .story-index {
        color: var(--ink-faint);
        font-weight: 500;
      }

      .story h2 {
        margin: 10px 0 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(24px, 3vw, 30px);
        line-height: 1.14;
      }

      .story h2 a {
        text-decoration: none;
      }

      .story h2 a:hover {
        text-decoration: underline;
        text-decoration-color: var(--rule-strong);
        text-underline-offset: 4px;
      }

      .story-byline {
        margin: 8px 0 0;
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--ink-faint);
      }

      .story-deck {
        margin: 14px 0 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .story-deck::first-letter {
        font-family: var(--font-display);
        font-size: 2.6em;
        font-weight: 700;
        float: left;
        line-height: 0.8;
        padding: 0.05em 0.06em 0 0;
        color: var(--ink);
      }

      .story-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 16px;
      }

      .story-tag {
        font-family: var(--font-sans);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-soft);
        border: 1px solid var(--rule);
        padding: 3px 8px;
        border-radius: 2px;
      }

      .story-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 18px;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink);
        border-bottom: 1px solid var(--rule-strong);
        padding-bottom: 1px;
      }

      .story-link:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .story-link svg {
        transition: transform 150ms ease;
      }

      .story-link:hover svg {
        transform: translateX(3px);
      }

      /* ---------- Colophon ---------- */

      .colophon {
        margin-top: 8px;
        padding: 22px 0 40px;
        text-align: center;
      }

      .colophon p {
        margin: 0;
        font-family: var(--font-sans);
        font-size: 12.5px;
        color: var(--ink-faint);
      }

      @media (max-width: 720px) {
        .front-page {
          grid-template-columns: 1fr;
        }
        .story:nth-child(odd) {
          border-right: none;
        }
        .masthead-meta {
          flex-direction: column;
          align-items: flex-start;
          gap: 2px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="masthead-bar">
      <div class="wrap masthead-meta">
        <span id="dateline">—</span>
        <span>Vol. I · No. II · Free, Always</span>
      </div>
    </div>

    <header class="masthead wrap">
      <h1>The Build Gazette</h1>
      <p>A front page for every project built here — each one live, working, and one click away.</p>
    </header>
    <div class="wrap">
      <hr class="rule-thick" />
      <hr class="rule-thin" />
    </div>

    <main class="wrap">
      <p class="section-label">On the front page</p>
      <div class="front-page" id="front-page"></div>
    </main>

    <footer class="wrap colophon">
      <p>Future dispatches will appear here as new projects ship.</p>
    </footer>

    <script>
      const PROJECTS = [
        {
          kicker: 'Science Desk',
          headline: 'Inside ChemLab, a Working Virtual Chemistry Laboratory',
          byline: 'An interactive chemistry laboratory · A-Level & high-school',
          deck:
            'Seven real experiments spanning organic, inorganic and acid–base chemistry. Run qualitative tests on 3D glassware, watch the colour change, and reason your way to a conclusion — the way an actual practical works, not a quiz pretending to be one.',
          tags: ['Virtual Laboratory', '3D', 'Chemistry'],
          href: 'chemlab/',
          linkText: 'Enter the laboratory',
        },
        {
          kicker: 'Fiction Desk',
          headline: 'CASEFILE Puts You in the Detective’s Chair',
          byline: 'An interactive detective mystery',
          deck:
            'Investigate a scene, interrogate suspects, weigh the evidence, and make an accusation you can actually defend. Every case is built to be solved on the facts — not on a lucky guess.',
          tags: ['Interactive Fiction', 'Mystery'],
          href: 'casefile/',
          linkText: 'Read the case file',
        },
      ]

      const frontPage = document.getElementById('front-page')
      PROJECTS.forEach((p, i) => {
        const article = document.createElement('article')
        article.className = 'story'
        article.innerHTML = `
          <div class="story-kicker">
            <span>${p.kicker}</span>
            <span class="story-index">No. ${String(i + 1).padStart(2, '0')}</span>
          </div>
          <h2><a href="${p.href}">${p.headline}</a></h2>
          <p class="story-byline">${p.byline}</p>
          <p class="story-deck">${p.deck}</p>
          <div class="story-tags">${p.tags.map((t) => `<span class="story-tag">${t}</span>`).join('')}</div>
          <a class="story-link" href="${p.href}">
            ${p.linkText}
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true">
              <path d="M0 5h12M8 1l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        `
        frontPage.appendChild(article)
      })

      document.getElementById('dateline').textContent = new Date().toLocaleDateString('en-GB', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      })
    </script>
  </body>
</html>
